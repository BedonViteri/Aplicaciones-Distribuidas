    post:
      tags: [Asignaturas]
      summary: Crear asignatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignaturaRequest'
      responses:
        '201':
          description: Asignatura creada
          content:
            application/json:
              schema:
