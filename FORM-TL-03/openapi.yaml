    post:
      tags: [Años Lectivos]
      summary: Crear año lectivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnoLectivoRequest'
      responses:
        '201':
          description: Año lectivo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnoLectivoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
