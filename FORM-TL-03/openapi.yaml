openapi: 3.0.3

info:
  title: SGA - Sistema de Gestión Académica
  version: 1.0.0
  description: >
    API REST del Sistema de Gestión Académica (SGA) para instituciones educativas.
    Cubre dos módulos: **sga_principal** (usuarios, estudiantes, matrículas, asignaciones,
    horarios, estructura académica) y **sga_docente** (actividades, calificaciones,
    asistencias, promedios, seguimiento académico).
    Toda operación requiere autenticación mediante Bearer JWT.

servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Autenticación y gestión de sesión
  - name: Usuarios
    description: Gestión de usuarios del sistema
  - name: Estudiantes
    description: Registro y consulta de estudiantes
  - name: Matrículas
    description: Proceso de matrícula de estudiantes
  - name: Asignaciones
    description: Asignaciones de docentes a asignaturas y paralelos
  - name: Asignaturas
    description: Catálogo de asignaturas
  - name: Grados y Paralelos
    description: Estructura de grados, paralelos y niveles educativos
  - name: Años Lectivos
    description: Gestión de años lectivos y períodos de evaluación
  - name: Horarios
    description: Horarios de clases
  - name: Actividades
    description: Actividades formativas y sumativas por asignación
  - name: Calificaciones
    description: Registro de notas de estudiantes
  - name: Asistencias
    description: Control de asistencia diaria
  - name: Promedios
    description: Cálculo y consulta de promedios trimestrales y anuales
  - name: Seguimiento
    description: Seguimiento académico por DECE, tutores y directivos
  - name: Auditoría
    description: Registro de auditoría del sistema

# ============================================================
# PATHS
# ============================================================

paths:

  # ── AUTH ──────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Autentica al usuario con username/correo y contraseña. Devuelve JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "jdoe"
              password: "Secreto123!"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas o usuario bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Invalida el token JWT del usuario autenticado.
      responses:
        '200':
          description: Sesión cerrada correctamente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/cambiar-password:
    post:
      tags: [Auth]
      summary: Cambiar contraseña
      description: Permite al usuario cambiar su contraseña. Obligatorio en el primer ingreso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada exitosamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── USUARIOS ──────────────────────────────────────────────

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: Retorna la lista paginada de usuarios del sistema.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: estado
          in: query
          description: Filtrar por estado activo/inactivo
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: Crea un nuevo usuario del sistema con sus datos de persona y roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/{id_usuario}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por ID
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Usuarios]
      summary: Desactivar usuario
      description: Desactiva el usuario (soft delete, estado=false).
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '204':
          description: Usuario desactivado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/{id_usuario}/roles:
    get:
      tags: [Usuarios]
      summary: Listar roles del usuario
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '200':
          description: Roles asignados al usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Usuarios]
      summary: Asignar rol a usuario
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_rol]
              properties:
                id_rol:
                  type: integer
      responses:
        '201':
          description: Rol asignado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── ESTUDIANTES ──────────────────────────────────────────

  /estudiantes:
    get:
      tags: [Estudiantes]
      summary: Listar estudiantes
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
