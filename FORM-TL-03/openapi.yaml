        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Años Lectivos]
      summary: Crear período de evaluación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodoEvaluacionRequest'
      responses:
        '201':
          description: Período creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoEvaluacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
