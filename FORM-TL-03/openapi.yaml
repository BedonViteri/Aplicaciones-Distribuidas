          $ref: '#/components/responses/InternalError'

  # ── HISTORIAL DE PROMOCIÓN ────────────────────────────────

  /historial-promocion:
    get:
      tags: [Matrículas]
      summary: Listar historial de promoción
      parameters:
        - name: id_estudiante
          in: query
          schema:
            type: integer
        - name: id_ano_lectivo
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Historial de promoción
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialPromocionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Matrículas]
      summary: Registrar resultado de promoción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistorialPromocionRequest'
      responses:
        '201':
          description: Historial registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialPromocionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── AUDITORÍA ─────────────────────────────────────────────

  /auditoria:
    get:
      tags: [Auditoría]
      summary: Consultar registros de auditoría
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: schema_origen
          in: query
          schema:
            type: string
            enum: [PRINCIPAL, DOCENTE]
        - name: id_usuario
          in: query
          schema:
            type: integer
        - name: tabla_afectada
          in: query
          schema:
            type: string
        - name: desde
          in: query
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Registros de auditoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoriaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

# ============================================================
# COMPONENTS
# ============================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT obtenido desde POST /auth/login.
        Incluir en header: Authorization: Bearer <token>

  # ── PARAMETERS ────────────────────────────────────────────

  parameters:
    PageParam:
      name: page
      in: query
      description: Número de página (base 0)
      schema:
        type: integer
        default: 0
        minimum: 0
    SizeParam:
      name: size
      in: query
      description: Cantidad de registros por página
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    IdUsuario:
      name: id_usuario
      in: path
      required: true
      schema:
        type: integer
    IdEstudiante:
      name: id_estudiante
      in: path
      required: true
      schema:
        type: integer
    IdMatricula:
      name: id_matricula
      in: path
      required: true
      schema:
        type: integer
    IdAsignacion:
      name: id_asignacion
      in: path
      required: true
      schema:
        type: integer
    IdAnoLectivo:
      name: id_ano_lectivo
      in: path
      required: true
      schema:
        type: integer
    IdPeriodo:
      name: id_periodo
      in: path
      required: true
      schema:
        type: integer
    IdActividad:
      name: id_actividad
      in: path
      required: true
      schema:
        type: integer
    IdAsignatura:
      name: id_asignatura
      in: path
      required: true
      schema:
        type: integer

  # ── RESPONSES ─────────────────────────────────────────────

  responses:
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2025-01-15T10:30:00Z"
            status: 400
            error: "Bad Request"
            message: "El campo 'nombres' es obligatorio"
            path: "/api/v1/estudiantes"

    Unauthorized:
      description: No autenticado o token inválido/expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2025-01-15T10:30:00Z"
            status: 401
            error: "Unauthorized"
            message: "Token JWT inválido o expirado"
            path: "/api/v1/estudiantes"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2025-01-15T10:30:00Z"
            status: 404
            error: "Not Found"
            message: "Registro no encontrado con id: 99"
            path: "/api/v1/estudiantes/99"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2025-01-15T10:30:00Z"
            status: 500
            error: "Internal Server Error"
            message: "Error inesperado. Contacte al administrador."
            path: "/api/v1/estudiantes"

  # ── SCHEMAS ───────────────────────────────────────────────

  schemas:

    # ── Enumeraciones ──

    Genero:
      type: string
      enum: [M, F, OTRO]
      description: Género de la persona

    EstadoMatricula:
      type: string
      enum: [ACTIVA, RETIRADA, TRASLADADA, PROMOVIDA, NO_PROMOVIDA]

    TipoAsignacion:
      type: string
      enum: [ESPECIALIZADO, TUTOR, PROVISIONAL]

    TipoActividad:
      type: string
      enum: [TAREA, PRUEBA, EXAMEN, PROYECTO, PARTICIPACION, OTRO]

    EstadoAsistencia:
      type: string
      enum: [PRESENTE, AUSENTE, JUSTIFICADO, ATRASO]

    NotaCualitativa:
      type: string
      enum: [DAR, AAR, PAR, NAAR]
      description: "Domina los Aprendizajes Requeridos, Alcanza, Próximo a Alcanzar, No Alcanza"

    TipoPeriodo:
      type: string
      enum: [TRIMESTRE_1, TRIMESTRE_2, TRIMESTRE_3]

    CategoriaSeguimiento:
      type: string
      enum: [ACADEMICO, CONDUCTUAL, PSICOLOGICO, FAMILIAR, SALUD]

    ResultadoPromocion:
      type: string
      enum: [PROMOVIDO, NO_PROMOVIDO, RETIRADO, TRASLADADO]

    TipoDocumento:
      type: string
      enum: [CEDULA, PARTIDA_NACIMIENTO, FOTO, FICHA_MEDICA, CERTIFICADO_OTRO]

    DiaSemana:
      type: string
      enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES]

    TipoEscala:
      type: string
      enum: [CUALITATIVA, CUANTITATIVA]

    OrigenListado:
      type: string
      enum: [NUEVO, TRANSFERIDO, REPITENTE, REINGRESO]

    # ── Paginación genérica ──

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total_elements:
          type: integer
          format: int64
        total_pages:
          type: integer

    # ── Auth ──

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 60
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Segundos hasta expiración
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'

    CambiarPasswordRequest:
      type: object
      required: [password_actual, password_nueva]
      properties:
        password_actual:
          type: string
          format: password
        password_nueva:
          type: string
          format: password
          minLength: 8

    # ── Usuarios y Roles ──

    RolResponse:
      type: object
      properties:
        id_rol:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
        activo:
          type: boolean

    UsuarioRequest:
      type: object
      required: [username, correo, nombres, apellidos]
      properties:
        username:
          type: string
          maxLength: 60
        correo:
          type: string
          format: email
          maxLength: 150
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        cedula:
          type: string
          maxLength: 10
        telefono:
          type: string
          maxLength: 20
        cargo:
          type: string
          maxLength: 80
        titulo_academico:
          type: string
          maxLength: 120
        especializacion:
          type: string
          maxLength: 120
        fecha_ingreso_inst:
          type: string
          format: date
        roles:
          type: array
          items:
            type: integer
          description: IDs de roles a asignar

    UsuarioResponse:
      type: object
      properties:
        id_usuario:
          type: integer
        uuid:
          type: string
          format: uuid
        username:
          type: string
        correo:
          type: string
        estado:
          type: boolean
        primer_ingreso:
          type: boolean
        ultimo_acceso:
          type: string
          format: date-time
        persona:
          type: object
          properties:
            id_persona:
              type: integer
            nombres:
              type: string
            apellidos:
              type: string
            cedula:
              type: string
            cargo:
              type: string
            titulo_academico:
              type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolResponse'

    UsuarioPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioResponse'

    # ── Estudiantes ──

    EstudianteRequest:
      type: object
      required: [nombres, apellidos]
      properties:
        cedula:
          type: string
          maxLength: 10
        codigo_estudiante:
          type: string
          maxLength: 20
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        fecha_nacimiento:
          type: string
          format: date
        genero:
          $ref: '#/components/schemas/Genero'
        direccion:
          type: string
        telefono:
          type: string
          maxLength: 20
        correo:
          type: string
          format: email
          maxLength: 150
        discapacidad:
          type: boolean
          default: false
        tipo_discapacidad:
          type: string
          maxLength: 100
        porcentaje_disc:
          type: integer
          minimum: 0
          maximum: 100
        id_representante:
          type: integer
        origen_listado:
          $ref: '#/components/schemas/OrigenListado'
        foto_url:
          type: string
          maxLength: 255

    EstudianteResponse:
      type: object
      properties:
        id_estudiante:
          type: integer
        cedula:
          type: string
        codigo_estudiante:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        genero:
          $ref: '#/components/schemas/Genero'
        discapacidad:
          type: boolean
        tipo_discapacidad:
          type: string
        estado:
          type: boolean
        representante:
          $ref: '#/components/schemas/RepresentanteResponse'
        fecha_creacion:
          type: string
          format: date-time

    EstudiantePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/EstudianteResponse'

    FichaEstudianteRequest:
      type: object
      properties:
        tipo_sangre:
          type: string
          maxLength: 5
        alergias:
          type: string
        medicacion_permanente:
          type: string
        enfermedad_catastrofica:
          type: boolean
          default: false
        detalle_enfermedad:
          type: string
        contacto_emergencia:
          type: string
          maxLength: 100
        telefono_emergencia:
          type: string
          maxLength: 20
        direccion_referencia:
          type: string

    FichaEstudianteResponse:
      allOf:
        - $ref: '#/components/schemas/FichaEstudianteRequest'
        - type: object
          properties:
            id_ficha:
              type: integer
            id_estudiante:
              type: integer
            fecha_actualizacion:
              type: string
              format: date-time

    # ── Representantes ──

    RepresentanteRequest:
      type: object
      required: [nombres, apellidos, parentesco]
      properties:
        cedula:
          type: string
          maxLength: 10
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        parentesco:
          type: string
          maxLength: 50
        telefono_principal:
          type: string
          maxLength: 20
        telefono_alt:
          type: string
          maxLength: 20
        correo:
          type: string
          format: email
        direccion:
          type: string

    RepresentanteResponse:
      allOf:
        - $ref: '#/components/schemas/RepresentanteRequest'
        - type: object
          properties:
            id_representante:
              type: integer

    RepresentantePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/RepresentanteResponse'

    # ── Años Lectivos ──

    AnoLectivoRequest:
      type: object
      required: [nombre, fecha_inicio, fecha_fin]
      properties:
        nombre:
          type: string
          maxLength: 20
          example: "2024-2025"
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        es_actual:
          type: boolean
          default: false

    AnoLectivoResponse:
      allOf:
        - $ref: '#/components/schemas/AnoLectivoRequest'
        - type: object
          properties:
            id_ano_lectivo:
              type: integer
            fecha_creacion:
              type: string
              format: date-time

    # ── Períodos de Evaluación ──

    PeriodoEvaluacionRequest:
      type: object
      required: [id_ano_lectivo, tipo, nombre, fecha_inicio, fecha_fin]
      properties:
        id_ano_lectivo:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoPeriodo'
        nombre:
          type: string
          maxLength: 40
          example: "Primer Trimestre"
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        activo:
          type: boolean
          default: true

    PeriodoEvaluacionResponse:
      allOf:
        - $ref: '#/components/schemas/PeriodoEvaluacionRequest'
        - type: object
          properties:
            id_periodo:
              type: integer

    # ── Niveles, Grados y Paralelos ──

    NivelResponse:
      type: object
      properties:
        id_nivel:
          type: integer
        nombre:
          type: string
        tipo_escala:
          $ref: '#/components/schemas/TipoEscala'
        grado_inicio:
          type: integer
        grado_fin:
          type: integer

    GradoRequest:
      type: object
      required: [id_nivel, nombre, orden]
      properties:
        id_nivel:
          type: integer
        nombre:
          type: string
          maxLength: 60
        orden:
          type: integer
        capacidad_max:
          type: integer
        activo:
          type: boolean
          default: true

    GradoResponse:
      allOf:
        - $ref: '#/components/schemas/GradoRequest'
        - type: object
          properties:
            id_grado:
              type: integer
            nivel:
              $ref: '#/components/schemas/NivelResponse'

    ParaleloRequest:
      type: object
      required: [id_grado, letra]
      properties:
        id_grado:
          type: integer
        letra:
          type: string
          maxLength: 1
          example: "A"
        activo:
          type: boolean
          default: true

    ParaleloResponse:
      allOf:
        - $ref: '#/components/schemas/ParaleloRequest'
        - type: object
          properties:
            id_paralelo:
              type: integer

    # ── Asignaturas ──

    AsignaturaRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 100
        codigo:
          type: string
          maxLength: 20
        descripcion:
          type: string
        horas_semana:
          type: integer
          minimum: 1
        activa:
          type: boolean
          default: true

    AsignaturaResponse:
      allOf:
        - $ref: '#/components/schemas/AsignaturaRequest'
        - type: object
          properties:
            id_asignatura:
              type: integer
            fecha_creacion:
              type: string
              format: date-time

    # ── Asignaciones ──

    AsignacionRequest:
      type: object
      required: [id_docente, id_asignatura, id_grado, id_paralelo, id_ano_lectivo]
      properties:
        id_docente:
          type: integer
        id_asignatura:
          type: integer
        id_grado:
          type: integer
        id_paralelo:
          type: integer
        id_ano_lectivo:
          type: integer
        es_tutor:
          type: boolean
          default: false
        tipo:
          $ref: '#/components/schemas/TipoAsignacion'
        activo:
          type: boolean
          default: true

    AsignacionResponse:
      allOf:
        - $ref: '#/components/schemas/AsignacionRequest'
        - type: object
          properties:
            id_asignacion:
              type: integer
            docente:
              type: object
              properties:
                id_usuario:
                  type: integer
                nombres:
                  type: string
                apellidos:
                  type: string
            asignatura:
              type: object
              properties:
                id_asignatura:
                  type: integer
                nombre:
                  type: string
            grado:
              type: object
              properties:
                id_grado:
                  type: integer
                nombre:
                  type: string
            paralelo:
              type: object
              properties:
                id_paralelo:
                  type: integer
                letra:
                  type: string
            fecha_asignacion:
              type: string
              format: date-time

    AsignacionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AsignacionResponse'

    # ── Matrículas ──

    MatriculaRequest:
      type: object
      required: [id_estudiante, id_grado, id_paralelo, id_ano_lectivo]
      properties:
        id_estudiante:
          type: integer
        id_grado:
          type: integer
        id_paralelo:
          type: integer
        id_ano_lectivo:
          type: integer
        numero_orden:
          type: integer
        observaciones:
          type: string

    MatriculaResponse:
      allOf:
        - $ref: '#/components/schemas/MatriculaRequest'
        - type: object
          properties:
            id_matricula:
              type: integer
            estado:
              $ref: '#/components/schemas/EstadoMatricula'
            fecha_registro:
              type: string
              format: date
            fecha_creacion:
              type: string
              format: date-time
            estudiante:
              type: object
              properties:
                id_estudiante:
                  type: integer
                nombres:
                  type: string
                apellidos:
                  type: string
                cedula:
                  type: string

    MatriculaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/MatriculaResponse'

    DocumentoMatriculaResponse:
      type: object
      properties:
        id_documento:
          type: integer
        id_matricula:
          type: integer
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumento'
        nombre_archivo:
          type: string
        ruta_archivo:
          type: string
        fecha_subida:
          type: string
          format: date-time

    # ── Horarios ──

    HorarioRequest:
      type: object
      required: [id_asignacion, id_periodo_diario, dia_semana]
      properties:
        id_asignacion:
          type: integer
        id_periodo_diario:
          type: integer
        dia_semana:
          $ref: '#/components/schemas/DiaSemana'

    HorarioResponse:
      allOf:
        - $ref: '#/components/schemas/HorarioRequest'
        - type: object
          properties:
            id_horario:
              type: integer
            hora_inicio:
              type: string
              example: "07:00"
            hora_fin:
              type: string
              example: "07:45"
            asignatura:
              type: string
            docente:
              type: string

    # ── Actividades ──

    ActividadRequest:
      type: object
      required: [id_asignacion, id_periodo, tipo, ponderacion, nota_maxima]
      properties:
        id_asignacion:
          type: integer
        id_periodo:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoActividad'
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        fecha_entrega:
          type: string
          format: date
        ponderacion:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 1.0
        nota_maxima:
          type: number
          format: float
          default: 10.0
        es_sumativa:
          type: boolean
          default: false

    ActividadResponse:
      allOf:
        - $ref: '#/components/schemas/ActividadRequest'
        - type: object
          properties:
            id_actividad:
              type: integer
            fecha_creacion:
              type: string
              format: date-time

    # ── Calificaciones ──

    CalificacionRequest:
      type: object
      required: [id_actividad, id_matricula]
      properties:
        id_actividad:
          type: integer
        id_matricula:
          type: integer
        nota:
          type: number
          format: float
          minimum: 0
          maximum: 10
        nota_cualitativa:
          $ref: '#/components/schemas/NotaCualitativa'
        observacion:
          type: string

    CalificacionResponse:
      allOf:
        - $ref: '#/components/schemas/CalificacionRequest'
        - type: object
          properties:
            id_calificacion:
              type: integer
              format: int64
            fecha_registro:
              type: string
              format: date-time
            fecha_actualizacion:
              type: string
              format: date-time

    # ── Asistencias ──

    AsistenciaBatchRequest:
      type: object
      required: [id_asignacion, id_periodo, fecha, registros]
      properties:
        id_asignacion:
          type: integer
        id_periodo:
          type: integer
        fecha:
          type: string
          format: date
        registros:
          type: array
          items:
            type: object
            required: [id_matricula, estado]
            properties:
              id_matricula:
                type: integer
              estado:
                $ref: '#/components/schemas/EstadoAsistencia'
              justificacion:
                type: string

