    # ── Seguimiento Académico ──

    SeguimientoRequest:
      type: object
      required: [id_matricula, id_periodo, descripcion, fecha_evento]
      properties:
        id_matricula:
          type: integer
        id_periodo:
          type: integer
        categoria:
