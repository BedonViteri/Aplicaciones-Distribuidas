        fecha_evento:
          type: string
          format: date

    SeguimientoResponse:
      allOf:
        - $ref: '#/components/schemas/SeguimientoRequest'
        - type: object
          properties:
            id_seguimiento:
              type: integer
              format: int64
            registrado_por:
              type: integer
            fecha_registro:
              type: string
              format: date-time

    SeguimientoPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/SeguimientoResponse'

