        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── ASIGNACIONES ──────────────────────────────────────────

  /asignaciones:
    get:
      tags: [Asignaciones]
      summary: Listar asignaciones
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: id_docente
          in: query
          schema:
            type: integer
        - name: id_ano_lectivo
          in: query
          schema:
            type: integer
        - name: activo
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de asignaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Asignaciones]
      summary: Crear asignación docente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
      responses:
        '201':
          description: Asignación creada
          content:
