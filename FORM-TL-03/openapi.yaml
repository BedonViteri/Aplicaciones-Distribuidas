  /estudiantes/{id_estudiante}:
    get:
      tags: [Estudiantes]
      summary: Obtener estudiante por ID
      parameters:
        - $ref: '#/components/parameters/IdEstudiante'
      responses:
        '200':
          description: Datos del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstudianteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Estudiantes]
      summary: Actualizar estudiante
      parameters:
        - $ref: '#/components/parameters/IdEstudiante'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstudianteRequest'
      responses:
        '200':
          description: Estudiante actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstudianteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /estudiantes/{id_estudiante}/ficha:
    get:
      tags: [Estudiantes]
      summary: Obtener ficha médica del estudiante
      parameters:
        - $ref: '#/components/parameters/IdEstudiante'
      responses:
        '200':
          description: Ficha médica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaEstudianteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Estudiantes]
      summary: Actualizar ficha médica
      parameters:
